<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Umapyoi 擷取</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd;
        font: 13px/1.6 "Segoe UI", "Microsoft JhengHei", sans-serif; }
      #wrap { display: flex; flex-direction: column; height: 100%; }
      #bar { padding: 8px 12px; background: #1c1c1c; border-bottom: 1px solid #333; }
      #bar b { color: #7ee081; }
      #bar button { margin-left: 8px; padding: 4px 10px; font: inherit;
        background: #2b2b2b; color: #eee; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
      #bar button:hover { background: #3a3a3a; }
      #bar button:active { background: #4a4a4a; }
      #stage { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      video, canvas { max-width: 100%; max-height: 100%; }
      canvas { display: none; }
      #hint { padding: 6px 12px; color: #888; }
      #notice { padding: 0 12px 6px; color: #ffd479; white-space: pre-wrap; }
      #notice:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="bar">
        狀態：<b id="status">等待主程序…</b>
        <span id="hint"></span>
        <!-- ⭐ 兩粒手動掣（用戶 2026-09-19 要求）：讀唔到數／好似卡住嗰陣唔使重開程式 -->
        <button id="refresh" title="重新揀遊戲視窗 ＋ 重新開始擷取（讀唔到數或者好似卡住嗰陣按）">強制更新</button>
        <button id="snapshot" title="將而家嘅狀況寫入 log 檔（連當時收到嘅最後一幀 PNG）">寫入診斷 log</button>
      </div>
      <div id="notice"></div>
      <div id="stage"><video id="v" autoplay muted playsinline></video></div>
    </div>
    <canvas id="c"></canvas>
    <script>
      const { ipcRenderer } = require('electron');
      // ⭐ channel 名嘅唯一來源（`electron/ipc-channels.cjs`）——`main.js` 用同一個檔
      //    （透過 ESM default import）。以前兩邊各自寫字面值：`ipcRenderer.send()`
      //    去冇 handler 嘅 channel 係**靜默丟棄** → 打錯一個字母 = 「按咗冇反應」。
      // ⚠️ 呢個 `require()` 一定要喺頁面最頂（同 electron 一齊）：classic script 冇
      //    hoisting 嘅保護，下面用 `IPC_CHANNELS.*` 之前一定要已經解構好。
      const { IPC_CHANNELS } = require('./ipc-channels.cjs');

      const video = document.getElementById('v');
      const canvas = document.getElementById('c');
      const statusEl = document.getElementById('status');
      const hintEl = document.getElementById('hint');
      const noticeEl = document.getElementById('notice');

      // ─────────── 兩粒手動掣（用戶 2026-09-19 要求）───────────
      // ① 強制更新：主程序會重新揀遊戲視窗、重送 ROI、重新開始擷取
      //    （＝唔使閂程式再開；專治「凍結／揀錯來源／改過遊戲視窗大細」）。
      // ② 寫入診斷 log：主程序會將而家嘅狀況（設定／來源／最近讀數／HUD 窗／log 尾）
      //    ＋ 當時收到嘅最後一幀 PNG 寫落檔，方便事後查。
      document.getElementById('refresh').addEventListener('click', () => {
        noticeEl.textContent = '⏳ 強制更新中…（重新揀來源 ＋ 重開擷取）';
        ipcRenderer.send(IPC_CHANNELS.refresh);
      });
      document.getElementById('snapshot').addEventListener('click', () => {
        noticeEl.textContent = '⏳ 寫入診斷 log 中…';
        ipcRenderer.send(IPC_CHANNELS.snapshot);
      });
      // 主程序做完之後會回一句（成功／失敗都要講，唔准靜默）。
      ipcRenderer.on(IPC_CHANNELS.notice, (_event, text) => {
        noticeEl.textContent = String(text ?? '');
      });

      // 目標幀率。幀間投票唔需要太快，5fps 已經足夠，而且唔會搶遊戲嘅 GPU。
      // 主程序可以經 IPC 改（技能畫面連拍模式用 1fps：一幀 4–6MB，冇必要密）。
      let targetFps = Number(new URLSearchParams(location.search).get('fps') || 0) || 5;
      let frameMs = 1000 / targetFps;

      // 遊戲內容區比例（賽馬娘桌面版冇固定解析度，只有固定 16:9）。
      // ⚠️ 呢個係**後備**值：真正來源係主程序（`src/vision/statbar.js` 嘅
      //    `DEFAULT_STATBAR_OPTIONS.aspect`，經 IPC `roi.aspect` 傳落嚟）——
      //    以前主程序傳咗 `aspect` 但呢邊冇讀，兩邊各自寫死一個比例（審計 H3）。
      let contentAspect = 9 / 16;

      // ⚠️ 2026-09-18：唔可以再把**整個視窗**縮到 640px 先傳！
      //    UI 係等比縮放 → 面板數字得 0.0098×圖闊 咁高，縮到 640px 之後得 ~6px，
      //    實測偵測 0/8（見 AGENTS 地雷 #22）。
      //    改為：**只剪面板條嗰個相對範圍，1:1 原生像素**先傳（頻寬反而更細）。
      //    相對範圍由主程序（statbar.js 嘅 DEFAULT_STATBAR_OPTIONS）經 IPC 傳落嚟，
      //    兩邊一定同一個來源，唔會各自寫死一組數字。
      let roi = null;
      // ⭐ 連拍模式可以再剪細：主程序經 IPC 傳一個「內容區比例」矩形落嚟，
      //    只傳嗰橛（例如「賽馬娘詳情」彈窗嘅技能清單）——
      //    全畫面 1928×1085 一幀 8MB，而且技能清單淨係佔中間一小橛，冇必要傳晒。
      let crop = null;
      const CROP_MAX_W = 1200; // 剪完之後最闊幾多（夠放 7 列技能名）

      let started = false;
      let lastSent = 0;

      ipcRenderer.on(IPC_CHANNELS.noSource, () => {
        statusEl.textContent = '揾唔到遊戲視窗';
        hintEl.textContent = '請先開賽馬娘，再重新啟動本程式。';
      });

      ipcRenderer.on(IPC_CHANNELS.roi, (_event, rect) => {
        roi = rect;
        // ⭐ 內容區比例由主程序嚟（唯一來源）——呢邊唔准再寫死一組（審計 H3）。
        // ⚠️ 欄位係**選填**（舊格式／未收到就冇）→ 保留後備值，行為同以前一樣
        //    （要向後兼容「新 renderer ＋ 舊 main」同「舊 renderer ＋ 新 main」）。
        const aspect = Number(rect?.aspect);
        if (Number.isFinite(aspect) && aspect > 0) contentAspect = aspect;
      });

      // 主程序可以調幀率（技能連拍模式用 1fps）。
      ipcRenderer.on(IPC_CHANNELS.fps, (_event, value) => {
        const n = Number(value);
        if (Number.isFinite(n) && n > 0) {
          targetFps = n;
          frameMs = 1000 / n;
        }
      });

      // 主程序可以再指定一個「內容區比例」矩形（連拍模式專用；null = 唔剪）。
      ipcRenderer.on(IPC_CHANNELS.crop, (_event, rect) => {
        crop = rect && rect.w > 0 && rect.h > 0 ? rect : null;
        hintEl.textContent = crop
          ? ` · 只剪內容區 ${(crop.w * 100).toFixed(0)}%×${(crop.h * 100).toFixed(0)}%`
          : '';
      });

      /**
       * 開始擷取（可以重複叫：主程序偵測到「凍結」就會再叫一次）。
       *
       * ⚠️ 以前 `if (started) return;` **永遠唔會重新擷取** —— 串流一斷（遊戲窗閂咗／
       * 螢幕鎖咗／driver reset）就**靜默死**：`video.videoWidth` 變 0 →
       * 下面嘅 loop 每次都 `return` → 一幀都唔再送，主程序只見到「冇新幀」。
       * 所以而家：再收到 start 就先拆舊串流再開新（＋ 明確報告失敗原因）。
       */
      let stream = null;
      let currentSourceId = null;
      let stallReported = false;

      function stopStream() {
        if (stream) {
          for (const track of stream.getTracks()) track.stop();
          stream = null;
        }
        video.srcObject = null;
        started = false;
      }

      ipcRenderer.on(IPC_CHANNELS.start, async (_event, sourceId) => {
        currentSourceId = sourceId;
        stopStream();
        started = true;
        stallReported = false;
        try {
          statusEl.textContent = '擷取中…';
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              mandatory: {
                chromeMediaSource: 'desktop',
                chromeMediaSourceId: sourceId,
                maxWidth: 4096,
                maxHeight: 4096,
                maxFrameRate: 30,
              },
            },
          });
          // ⚠️ 串流一斷就要即刻講（唔可以等主程序自己發現「冇幀」）—— 呢個係真失敗，唔係轉場。
          for (const track of stream.getTracks()) {
            track.addEventListener('ended', () => {
              ipcRenderer.send(IPC_CHANNELS.captureError, '擷取串流已結束（track ended）');
            });
          }
          video.srcObject = stream;
          await video.play();
          statusEl.textContent = '擷取中';
          loop();
        } catch (error) {
          statusEl.textContent = '擷取失敗';
          hintEl.textContent = String(error && error.message ? error.message : error);
          ipcRenderer.send(IPC_CHANNELS.captureError, String(error));
        }
      });

      // ⭐ 停滯偵察：開咗擷取但係好耐都冇畫面（videoWidth 0）＝ 串流死咗／未起。
      //    只報告一次，避免洗版；真正嘅重試由主程序決定（佢有次數上限）。
      setInterval(() => {
        if (!started) return;
        if (video.videoWidth > 0) {
          stallReported = false;
          return;
        }
        if (stallReported) return;
        stallReported = true;
        ipcRenderer.send(
          IPC_CHANNELS.captureError,
          `擷取停滯：已經開始擷取但 3 秒內冇畫面（sourceId=${currentSourceId}）`,
        );
      }, 3000);

      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      function loop(now) {
        requestAnimationFrame(loop);
        if (!video.videoWidth || !video.videoHeight) return;
        if (now && now - lastSent < frameMs) return;
        lastSent = now || 0;

        const vw = video.videoWidth;
        const vh = video.videoHeight;

        // ⚠️ 安全閥：ROI 覆蓋成個畫面（連拍模式）就係 1:1 全畫面（一幀 4–6MB），
        //    5fps 會無謂咁燒頻寬同 CPU → 夾到 2fps 或以下（正常模式剪面板條唔受影響）。
        const fullFrame = roi && roi.x0 <= 0 && roi.x1 >= 1 && roi.y0 <= 0 && roi.y1 >= 1;
        if (fullFrame && targetFps > 2) {
          targetFps = 2;
          frameMs = 500;
        }

        // 內容框：如果擷取到嘅高度大過 16:9（例如連埋標題列），多出嘅部分喺頂
        const contentH = Math.min(vh, Math.round(vw * contentAspect));
        const contentTop = Math.max(0, vh - contentH);

        // 有 ROI → 1:1 剪出嚟；冇 → 退回舊行為（縮圖全畫面）
        // ⚠️ 技能連拍模式會傳 x0=0／x1=1／y0=0／y1=1（＝整個內容區），
        //    呢個時候要用 `vw`／`contentH` 而唔係 `Math.round(vw*1)`（差一像素都好）。
        const sx0 = roi ? Math.round(vw * roi.x0) : 0;
        const sx1 = roi ? (roi.x1 >= 1 ? vw : Math.max(sx0 + 8, Math.round(vw * roi.x1))) : vw;
        const sy0 = roi ? (roi.y0 <= 0 ? contentTop : contentTop + Math.round(contentH * roi.y0)) : 0;
        const sy1 = roi ? (roi.y1 >= 1 ? contentTop + contentH : Math.max(sy0 + 8, contentTop + Math.round(contentH * roi.y1))) : vh;
        const sw = Math.min(vw - sx0, sx1 - sx0);
        const sh = Math.min(vh - sy0, sy1 - sy0);

        // ⭐ 連拍模式可以再剪細（crop 係「相對於上面嗰個 ROI 範圍」嘅比例）。
        let cx = sx0;
        let cy = sy0;
        let cw = sw;
        let ch = sh;
        if (crop) {
          cx = sx0 + Math.round(sw * crop.x);
          cy = sy0 + Math.round(sh * crop.y);
          cw = Math.max(16, Math.round(sw * crop.w));
          ch = Math.max(16, Math.round(sh * crop.h));
          cw = Math.min(cw, vw - cx);
          ch = Math.min(ch, vh - cy);
        }

        const scale = roi ? 1 : Math.min(1, 640 / vw);
        let width = Math.max(1, Math.round(cw * scale));
        let height = Math.max(1, Math.round(ch * scale));

        // ⚠️ 剪細之後仍然太闊（例如全畫面）→ 等比縮到 ≤ CROP_MAX_W，避免一幀 8MB。
        if (width > CROP_MAX_W) {
          const k = CROP_MAX_W / width;
          width = CROP_MAX_W;
          height = Math.max(1, Math.round(height * k));
        }

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        ctx.drawImage(video, cx, cy, cw, ch, 0, 0, width, height);
        const image = ctx.getImageData(0, 0, width, height);

        ipcRenderer.send(IPC_CHANNELS.frame, {
          width,
          height,
          fullWidth: vw,
          fullHeight: vh,
          cropped: Boolean(roi),
          buffer: image.data.buffer,
        });

        hintEl.textContent =
          ' · 遊戲 ' + vw + '×' + vh +
          (roi ? ' → ' + width + '×' + height + '（原生像素）' : ' → 縮圖 ' + width + '×' + height) +
          ' @' + targetFps + 'fps';
      }
    </script>
  </body>
</html>
