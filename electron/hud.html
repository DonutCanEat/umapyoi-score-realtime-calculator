<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Umapyoi HUD</title>
    <style>
      /* 醜版：先求睇得到、唔搶眼、唔遮遊戲內容。 */
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: transparent;   /* 一定要透明，否則會遮住遊戲 */
        overflow: hidden;
        font: 600 13px/1.25 "Segoe UI", "Microsoft JhengHei", sans-serif;
        color: #fff;
        user-select: none;
        cursor: default;
      }
      #box {
        height: 100%;
        display: flex; flex-direction: column; gap: 3px;
        padding: 5px 8px;
        background: rgba(0, 0, 0, 0.56);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        box-sizing: border-box;
      }
      #total { font-size: 19px; letter-spacing: 0.5px; white-space: nowrap; }
      /* 逐格五維：標籤 + 右對齊數字（等闊字型，數值唔會跳） */
      #stats { display: flex; flex-direction: column; gap: 0; }
      .row { display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
      .row .label { color: #cfd8dc; font-weight: 400; }
      .row .value { font-variant-numeric: tabular-nums; }
      #summary { font-size: 11px; font-weight: 400; color: #b9f6c0; white-space: nowrap; }
      #note { font-size: 11px; font-weight: 400; color: #9ef0a8; white-space: nowrap; }
      /* 金色格提示（屬性 > 1200）。⚠️ 主程序只知「有一格」，唔知係邊一格 → 唔可以標某一格。 */
      #gold { font-size: 11px; font-weight: 400; color: #ffd479; white-space: nowrap; }
      /* 顯示選項閂咗 = 主程序唔推嗰一項 → 呢度收到空字串就唔畫（連個框都唔要）。 */
      #total:empty, #stats:empty, #summary:empty, #note:empty, #edit:empty, #gold:empty { display: none; }
      /* 對位模式：顯示範圍／偏移（`UMAPYOI_HUD_EDIT=1`） */
      #edit { font-size: 10px; font-weight: 400; color: #ffd479; white-space: nowrap; }
      /* 狀態色：綠 = 即時、黃 = 用緊上一個穩定值、灰 = 未有數、藍 = 對位模式 */
      body[data-state="ok"] #note { color: #9ef0a8; }
      body[data-state="stale"] #note { color: #ffd479; }
      body[data-state="stale"] #summary { color: #ffe0a3; }
      body[data-state="none"] #note { color: #bbb; }
      body[data-state="none"] #total { color: #ddd; }
      body[data-state="edit"] { outline: 1px dashed #6ec6ff; outline-offset: -2px; }
      body[data-state="edit"] #note { color: #6ec6ff; }
    </style>
  </head>
  <body data-state="none">
    <div id="box">
      <div id="total">評價点 —</div>
      <div id="stats"></div>
      <div id="summary"></div>
      <div id="gold"></div>
      <div id="note">等待面板條（開育成主畫面）</div>
      <div id="edit"></div>
    </div>
    <script>
      const { ipcRenderer } = require('electron');
      const totalEl = document.getElementById('total');
      const statsEl = document.getElementById('stats');
      const summaryEl = document.getElementById('summary');
      const noteEl = document.getElementById('note');
      const editEl = document.getElementById('edit');
      const goldEl = document.getElementById('gold');

      /** 五維逐格（主程序已經按「速度／持久／力量／毅力／智力」排好）。 */
      let statKeys = '';

      // 顯示邏輯（狀態機）喺 src/hud/layout.js 嘅 hudState()，主程序計好先推落嚟，
      // 呢邊只負責畫 —— 免得兩邊各寫一套判斷。
      ipcRenderer.on('hud', (_event, view) => {
        document.body.dataset.state = view.state;

        const total = view.lines.find((l) => l.key === 'total');
        // 空字串 = 主程序話「呢一項唔顯示」（顯示選項閂咗）→ `:empty` CSS 會收埋個框。
        totalEl.textContent = total ? `評價点 ${total.value}` : '';

        const stats = view.lines.filter((l) => l.key.startsWith('stat'));
        const nextKeys = stats.map((l) => `${l.key}:${l.label}:${l.value}`).join('|');
        if (nextKeys !== statKeys) {
          statKeys = nextKeys;
          statsEl.textContent = '';
          for (const s of stats) {
            const row = document.createElement('div');
            row.className = 'row';
            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = s.label;
            const value = document.createElement('span');
            value.className = 'value';
            value.textContent = s.value;
            row.append(label, value);
            statsEl.append(row);
          }
        }

        summaryEl.textContent = view.summary.map((s) => `${s.label} ${s.value}`).join('　');
        noteEl.textContent = view.note ?? '';
        editEl.textContent = view.edit ?? '';
        // 金色格：⚠️ 主程序嘅 `highlighted` 係「整條數值列」一個 boolean
        //（唔係逐格）→ 只可以老實講「有」，唔可以標某一格（見 layout.js hudState 註解）。
        goldEl.textContent = view.gold ? '⭐ 金色格（≥1200）' : '';
      });
    </script>
  </body>
</html>
