<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>Umapyoi HUD</title>
    <style>
      /* 醜版：先求睇得到、唔搶眼、唔遮遊戲內容。 */
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: transparent;   /* 一定要透明，否則會遮住遊戲 */
        overflow: hidden;
        font: 600 13px/1.25 "Segoe UI", "Microsoft JhengHei", sans-serif;
        color: #fff;
        user-select: none;
        cursor: default;
      }
      #box {
        height: 100%;
        display: flex; flex-direction: column; gap: 3px;
        padding: 5px 8px;
        background: rgba(0, 0, 0, 0.56);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        box-sizing: border-box;
      }
      #total { font-size: 19px; letter-spacing: 0.5px; white-space: nowrap; }
      /* 逐格五維：標籤 + 右對齊數字（等闊字型，數值唔會跳） */
      #stats { display: flex; flex-direction: column; gap: 0; }
      .row { display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
      .row .label { color: #cfd8dc; font-weight: 400; }
      .row .value { font-variant-numeric: tabular-nums; }
      #summary { font-size: 11px; font-weight: 400; color: #b9f6c0; white-space: nowrap; }
      #note { font-size: 11px; font-weight: 400; color: #9ef0a8; white-space: nowrap; }
      /* ⭐ C3 成長曲線：主程序推落嚟嘅折線座標（`view.history.points`），呢邊只畫唔計。 */
      #history { display: block; }
      #history svg { display: block; width: 100%; height: 22px; overflow: visible; }
      #history polyline { fill: none; stroke: #8fd6ff; stroke-width: 1.4; stroke-linejoin: round; }
      #history .hist { font-size: 10px; font-weight: 400; color: #9aa4ad; white-space: nowrap; }
      /* 金色格提示（屬性 > 1200）。⚠️ 主程序只知「有一格」，唔知係邊一格 → 唔可以標某一格。 */
      #gold { font-size: 11px; font-weight: 400; color: #ffd479; white-space: nowrap; }
      /* 顯示選項閂咗 = 主程序唔推嗰一項 → 呢度收到空字串就唔畫（連個框都唔要）。 */
      #total:empty, #stats:empty, #summary:empty, #note:empty, #edit:empty, #gold:empty { display: none; }
      /* ⭐ C3：`#history` 唔用 `:empty` —— 佢內部一定有 SVG／文字節點，靠主程序推唔推落嚟控制。 */
      #history[hidden] { display: none; }
      /* 對位模式：顯示範圍／偏移（`UMAPYOI_HUD_EDIT=1`） */
      #edit { font-size: 10px; font-weight: 400; color: #ffd479; white-space: nowrap; }
      /* 對位模式先出「可以拖」提示（同埋換鼠標）。⚠️ 正常模式呢個窗係穿透嘅，
         根本收唔到滑鼠事件 —— 所以唔會擋住用戶點遊戲。 */
      #hint { display: none; font-size: 10px; font-weight: 400; color: #6ec6ff; white-space: nowrap; }
      body[data-state="edit"] #hint { display: block; }
      body[data-state="edit"] { cursor: move; }
      /* ⚠️ 唔用 `-webkit-app-region: drag`：佢同 `setIgnoreMouseEvents(true)` 物理上互斥
         （穿透緊收唔到 mousedown），而且透明窗 + focusable:false 之下行為未文檔化。
         手動拖（pointerdown/move/up + screenX/screenY）先可控。 */
      /* 狀態色：綠 = 即時、黃 = 用緊上一個穩定值、灰 = 未有數、藍 = 對位模式 */
      body[data-state="ok"] #note { color: #9ef0a8; }
      body[data-state="stale"] #note { color: #ffd479; }
      body[data-state="stale"] #summary { color: #ffe0a3; }
      body[data-state="none"] #note { color: #bbb; }
      body[data-state="none"] #total { color: #ddd; }
      body[data-state="edit"] { outline: 1px dashed #6ec6ff; outline-offset: -2px; }
      body[data-state="edit"] #note { color: #6ec6ff; }
    </style>
  </head>
  <body data-state="none">
    <div id="box">
      <div id="total">評價点 —</div>
      <div id="stats"></div>
      <div id="summary"></div>
      <div id="history" hidden></div>
      <div id="gold"></div>
      <div id="note">等待面板條（開育成主畫面）</div>
      <div id="edit"></div>
      <div id="hint">✥ 按住拖我搬位（放手即寫入 hud-position.json）</div>
    </div>
    <script>
      const { ipcRenderer } = require('electron');
      const totalEl = document.getElementById('total');
      const statsEl = document.getElementById('stats');
      const summaryEl = document.getElementById('summary');
      const noteEl = document.getElementById('note');
      const editEl = document.getElementById('edit');
      const goldEl = document.getElementById('gold');
      const historyEl = document.getElementById('history');

      /** ⭐ C3 成長曲線：上一次畫嘅座標字串（唔變就唔重畫 SVG，免得每幀重建 DOM）。 */
      let historyKey = '';

      /**
       * 畫成長曲線（**只畫** —— 座標同摘要全部由主程序經 `src/hud/history.js` 計好）。
       *
       * ⚠️ 呢度**唔准**自己計斜率／縮放：renderer 冇測試覆蓋（見 AGENTS §9.1），
       *    畫錯線係靜默嘅。主程序傳 `viewBox` 座標（100×22），呢邊只負責塞入 `<polyline>`。
       */
      function renderHistory(view) {
        if (!view || !view.points || view.points.length < 2) {
          // 唔夠兩個點 → 畫唔到線；有記錄嘅話老實講「等緊變化」，冇就索性唔出。
          const fallback = view && view.count === 1 ? '成長曲線：等緊下一次變化' : '';
          if (historyEl.dataset.fallback === fallback) return;
          historyEl.dataset.fallback = fallback;
          historyKey = '';
          historyEl.hidden = !fallback;
          historyEl.textContent = fallback;
          return;
        }
        const key = `${view.width}x${view.height}|${view.points.map((p) => `${p.x},${p.y}`).join(' ')}|${view.delta}|${view.capped}`;
        if (key === historyKey) return;
        historyKey = key;
        const minutes = Math.round(view.spanMs / 60000);
        const sign = view.delta >= 0 ? '+' : '';
        const svgNs = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNs, 'svg');
        svg.setAttribute('viewBox', `0 0 ${view.width} ${view.height}`);
        svg.setAttribute('preserveAspectRatio', 'none');
        const line = document.createElementNS(svgNs, 'polyline');
        line.setAttribute('points', view.points.map((p) => `${p.x},${p.y}`).join(' '));
        svg.append(line);
        const label = document.createElement('div');
        label.className = 'hist';
        label.textContent = `成長 ${sign}${view.delta}（${minutes} 分鐘${view.capped ? '，只顯示最近一段' : ''}）`;
        historyEl.hidden = false;
        historyEl.replaceChildren(svg, label);
      }

      /** 五維逐格（主程序已經按「速度／持久／力量／毅力／智力」排好）。 */
      let statKeys = '';

      // 顯示邏輯（狀態機）喺 src/hud/layout.js 嘅 hudState()，主程序計好先推落嚟，
      // 呢邊只負責畫 —— 免得兩邊各寫一套判斷。
      ipcRenderer.on('hud', (_event, view) => {
        document.body.dataset.state = view.state;

        const total = view.lines.find((l) => l.key === 'total');
        // 空字串 = 主程序話「呢一項唔顯示」（顯示選項閂咗）→ `:empty` CSS 會收埋個框。
        totalEl.textContent = total ? `評價点 ${total.value}` : '';

        const stats = view.lines.filter((l) => l.key.startsWith('stat'));
        const nextKeys = stats.map((l) => `${l.key}:${l.label}:${l.value}`).join('|');
        if (nextKeys !== statKeys) {
          statKeys = nextKeys;
          statsEl.textContent = '';
          for (const s of stats) {
            const row = document.createElement('div');
            row.className = 'row';
            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = s.label;
            const value = document.createElement('span');
            value.className = 'value';
            value.textContent = s.value;
            row.append(label, value);
            statsEl.append(row);
          }
        }

        summaryEl.textContent = view.summary.map((s) => `${s.label} ${s.value}`).join('　');
        noteEl.textContent = view.note ?? '';
        editEl.textContent = view.edit ?? '';
        // 金色格：⚠️ 主程序嘅 `highlighted` 係「整條數值列」一個 boolean
        //（唔係逐格）→ 只可以老實講「有」，唔可以標某一格（見 layout.js hudState 註解）。
        goldEl.textContent = view.gold ? '⭐ 金色格（≥1200）' : '';
        // ⭐ C3 成長曲線（座標／摘要由主程序計；顯示選項 `history` 閂咗就係 null）
        renderHistory(view.history);
      });

      // ───────────────── 對位模式：手動拖位（只有 edit 態可以做）─────────────────
      //
      // 為何手動拖而唔用 `-webkit-app-region: drag`：
      //   ① 佢同 `setIgnoreMouseEvents(true)` 物理上互斥（穿透緊收唔到 mousedown）
      //   ② 透明窗 + `focusable:false` + `resizable:false` 之下行為未文檔化
      //
      // ⚠️ 一定要用 `e.screenX / e.screenY`（螢幕座標），**唔准**用 `clientX/clientY`：
      //    後者相對視窗，主程序一 `setBounds()` 移窗，同一個手勢就會計出唔同嘅相對座標
      //    → 自我回饋 → HUD 抖／暴走。
      //
      // 傳嘅係「相對按下嗰刻嘅**總位移**」（唔係每格增量），所以就算中間漏咗幾個
      // pointermove 都唔會累積誤差。
      let drag = null;
      const dragEnabled = () => document.body.dataset.state === 'edit';

      window.addEventListener('pointerdown', (e) => {
        if (!dragEnabled() || e.button !== 0) return;
        drag = { id: e.pointerId, x: e.screenX, y: e.screenY, dx: 0, dy: 0 };
        // 捕捉指標：就算拖出窗外面放手都收得到 pointerup（唔會卡住拖曳狀態）。
        try {
          e.target.setPointerCapture?.(e.pointerId);
        } catch {
          /* 捕捉唔到都用得（主程序另有 watchdog） */
        }
        ipcRenderer.send('hud-drag-start', { x: e.screenX, y: e.screenY });
        e.preventDefault();
      });

      window.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.screenX - drag.x;
        const dy = e.screenY - drag.y;
        if (dx === drag.dx && dy === drag.dy) return; // 冇動過就唔好 send
        drag.dx = dx;
        drag.dy = dy;
        ipcRenderer.send('hud-drag-move', { dx, dy });
      });

      function endDrag(e) {
        if (!drag || (e && e.pointerId !== undefined && e.pointerId !== drag.id)) return;
        const d = drag;
        drag = null;
        try {
          e?.target?.releasePointerCapture?.(d.id);
        } catch {
          /* 已自動釋放 */
        }
        ipcRenderer.send('hud-drag-end', { dx: d.dx, dy: d.dy });
      }

      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);
      // 窗失焦（例如 Alt+Tab）＝ 唔會再有 pointerup → 當收手，唔好永遠等落去。
      window.addEventListener('blur', () => endDrag(null));
    </script>
  </body>
</html>
